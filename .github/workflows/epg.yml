name: Actualizar EPG
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 epg_airtek.py Playlist-con-logos.m3u
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add guide.xml
          git commit -m "Actualizar guía" || echo "sin cambios"
          git push
